[workspace]
resolver = "2"
members = ["crates/ws-core", "crates/ws-cli", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["ws1004"]
license = "MIT"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"

# dev 빌드에서도 의존성(해시 등)은 최적화해서 컴파일: 이미징 속도를 release와 비슷하게 유지
[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1

[profile.release]
lto = true
codegen-units = 1
strip = true
# panic = "abort"는 쓰지 않음: GUI에서 엔진 패닉을 잡아 화면에 알리기 위해 (catch_unwind)
